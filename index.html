<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Peak</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">
  <div id="navwrap"></div>
  <main id="main" class="main"></main>
  <div id="rest" class="rest" hidden>
    <div class="rest-main">
      <div class="rest-head"><span class="eyebrow dark">REST</span><span id="rest-time" class="rest-time">0:00</span></div>
      <div class="rest-track"><i id="rest-bar"></i></div>
    </div>
    <button class="rest-btn" data-act="rest-add" data-d="-15" aria-label="Remove 15 seconds">−15</button>
    <button class="rest-btn" data-act="rest-add" data-d="15" aria-label="Add 15 seconds">+15</button>
    <button id="rest-default" class="rest-btn" data-act="rest-default" hidden>Default</button>
    <button class="rest-btn dark" data-act="rest-skip">Skip</button>
  </div>
  <div id="sheetwrap"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script src="js/data.js"></script>
<script src="js/guides.js"></script>
<script src="js/gear.js"></script>
<script src="js/app.js"></script>
<script src="js/screens.js"></script>
<script src="js/plans.js"></script>
<script src="js/planning.js"></script>
<script src="js/awards.js"></script>
<script src="js/climb.js"></script>
<script src="js/history.js"></script>
<script src="js/sync.js"></script>
</body>
</html>
